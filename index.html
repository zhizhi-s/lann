<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zhi Zhi - پانێڵی بەڕێوەبەر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
        }

        :root {
            --bg: #f7faf9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-dark: #059669;
            --green-light: #d1fae5;
            --green-bg: #ecfdf5;
            --border: #e9edf0;
            --shadow: 0 4px 24px rgba(16, 185, 129, 0.08);
            --shadow-hover: 0 12px 32px rgba(16, 185, 129, 0.15);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-full: 9999px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-weight: 500;
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid rgba(16, 185, 129, 0.08);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            height: 64px;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .header-logo span {
            color: var(--green-dark);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .logout-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--green-bg);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--green-dark);
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background: var(--green-light);
            transform: scale(1.04);
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
            padding: 20px 0 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .section-title i {
            color: var(--green-dark);
        }

        .content-section {
            display: none;
            animation: fadeUp 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-login-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            max-width: 400px;
            margin: 40px auto;
        }

        .admin-login-box h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-login-box h2 i { color: var(--green-dark); }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            transition: var(--transition);
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
            background: #fff;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg);
            transition: var(--transition);
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--green-dark);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            background: #047857;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
        }

        .alert {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            background: #fef2f2;
            color: #dc2626;
            font-weight: 600;
            font-size: 14px;
            display: none;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .alert.show { display: flex; }

        .admin-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none;
        }

        .admin-tabs::-webkit-scrollbar { display: none; }

        .admin-tab {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--card-bg);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .admin-tab:hover { border-color: var(--green); }

        .admin-tab.active {
            background: var(--green-dark);
            color: #fff;
            border-color: var(--green-dark);
        }

        .admin-tab-content {
            display: none;
            animation: fadeUp 0.3s ease;
        }

        .admin-tab-content.active { display: block; }

        .admin-form-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .admin-form-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .admin-form-title i { color: var(--green-dark); }

        .admin-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .admin-form-group.full-width { grid-column: 1 / -1; }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
            font-weight: 500;
            font-size: 14px;
            justify-content: center;
        }

        .form-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--green-dark);
        }

        .admin-form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .admin-btn {
            padding: 12px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn-primary { background: var(--green-dark); color: #fff; }
        .admin-btn-primary:hover { background: #047857; transform: translateY(-2px); }

        .admin-btn-secondary {
            background: var(--bg);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .admin-btn-secondary:hover { background: var(--border); }

        .admin-action-btn {
            padding: 6px 14px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .admin-action-btn.edit { background: var(--green-bg); color: var(--green-dark); }
        .admin-action-btn.edit:hover { background: var(--green-light); }

        .admin-action-btn.delete { background: #fef2f2; color: #dc2626; }
        .admin-action-btn.delete:hover { background: #fee2e2; }

        .admin-app-actions {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            z-index: 3500;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-y: auto;
        }

        .edit-modal.active { display: flex; }

        .edit-modal-content {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 620px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px 24px 24px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.3s ease;
            position: relative;
        }

        .edit-modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .edit-modal-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .edit-modal-close {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            z-index: 5;
        }

        .edit-modal-close:hover { background: var(--border); }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .card-img {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: var(--green-bg);
            overflow: hidden;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .card-img .image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16%;
        }

        .card-img .image-inner {
            width: 100%;
            height: 100%;
            border-radius: calc(var(--radius) + 4px);
            overflow: hidden;
            position: relative;
            background: var(--card-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: calc(var(--radius) + 4px);
        }

        .card:hover .card-img img {
            transform: scale(1.04);
        }

        .card-img .placeholder-icon {
            font-size: 40px;
            color: var(--green);
            opacity: 0.3;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pin-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            z-index: 3;
            animation: pinPulse 2s ease-in-out infinite;
        }

        .pin-badge i {
            transform: rotate(-45deg);
        }

        @keyframes pinPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 6px 18px rgba(245, 158, 11, 0.6); }
        }

        .card-body {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
            text-align: center;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card-category {
            font-size: 10px;
            font-weight: 600;
            color: var(--green-dark);
            background: var(--green-bg);
            padding: 2px 10px;
            border-radius: var(--radius-full);
        }

        .card-version {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .card-downloads {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-downloads i {
            color: var(--green-dark);
            font-size: 12px;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-weight: 500;
        }

        .loading i {
            font-size: 28px;
            color: var(--green);
            animation: spin 1s linear infinite;
            display: block;
            margin-bottom: 8px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .no-items {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-weight: 500;
        }

        .no-items i {
            font-size: 32px;
            color: var(--text-muted);
            opacity: 0.3;
            display: block;
            margin-bottom: 8px;
        }

        .hidden { display: none !important; }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 960px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
            .container { padding: 0 32px; }
            .section-title { font-size: 24px; }
        }

        @media (max-width: 640px) {
            .admin-form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .header-content { height: 56px; padding: 8px 0; }
            .header-logo { font-size: 17px; }
            .logout-btn { width: 36px; height: 36px; font-size: 15px; }

            .card-title { font-size: 14px; }
            .card-body { padding: 10px 12px 12px; }
            .card-img .image-wrapper { padding: 12%; }

            .edit-modal-content { padding: 24px 16px 20px; }
        }

        @media (max-width: 380px) {
            .grid { gap: 12px; }
            .card-body { padding: 8px 10px 10px; }
            .card-title { font-size: 13px; }
            .card-category, .card-version { font-size: 9px; }
            .card-img .image-wrapper { padding: 10%; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="header-logo">
                    Zhi<span>Zhi</span> Admin
                </div>
                <div class="header-right">
                    <button class="logout-btn" id="logoutBtn" title="چوونەدەرەوە">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="admin-login-page" class="content-section active">
            <div class="admin-login-box">
                <h2><i class="fas fa-user-shield"></i> چوونەژوورەوەی ئەدمین</h2>
                <div class="alert" id="login-error"><i class="fas fa-exclamation-circle"></i> ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە.</div>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label>ناوی بەکارهێنەر</label>
                        <input type="text" id="username" class="form-control" placeholder="ناوی بەکارهێنەر" required>
                    </div>
                    <div class="form-group">
                        <label>وشەی نهێنی</label>
                        <input type="password" id="password" class="form-control" placeholder="وشەی نهێنی" required>
                    </div>
                    <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> چوونەژوورەوە</button>
                </form>
            </div>
        </section>

        <section id="admin-panel-page" class="content-section">
            <div class="section-title"><i class="fas fa-cogs"></i> بەڕێوەبەری</div>

            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="add-app"><i class="fas fa-plus-circle"></i> زیادکردن</button>
                <button class="admin-tab" data-tab="manage-apps"><i class="fas fa-mobile-alt"></i> ئەپەکان</button>
                <button class="admin-tab" data-tab="manage-games"><i class="fas fa-gamepad"></i> یاریەکان</button>
                <button class="admin-tab" data-tab="manage-ios"><i class="fab fa-apple"></i> IOS</button>
            </div>

            <div class="admin-tab-content active" id="add-app-tab">
                <div class="admin-form-container">
                    <div class="admin-form-title"><i class="fas fa-plus-circle"></i> زیادکردنی بەرنامەی نوێ</div>
                    <form id="add-app-form">
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label>جۆر</label>
                                <select id="app-type" class="form-select" required>
                                    <option value="">هەڵبژێرە</option>
                                    <option value="app">ئەپ</option>
                                    <option value="game">یاری</option>
                                    <option value="ios">IOS</option>
                                </select>
                            </div>
                            <div class="admin-form-group">
                                <label>ناو</label>
                                <input type="text" id="app-name" class="form-control" placeholder="ناوی بەرنامە" required>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label>ڤێرژن</label>
                                <input type="text" id="app-version" class="form-control" placeholder="نمونە: 1.0.0" value="1.0.0">
                            </div>
                            <div class="admin-form-group">
                                <label>پلاتفۆرم</label>
                                <select id="app-platform" class="form-select">
                                    <option value="android">Android</option>
                                    <option value="ios">iOS</option>
                                </select>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group full-width">
                                <label>Description (تەواو)</label>
                                <textarea id="app-description-long" class="form-control" rows="4" placeholder="Description ی تەواو بۆ پەڕەی داگرتن..."></textarea>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group full-width">
                                <label>زانیارییەکان (Info)</label>
                                <textarea id="app-info" class="form-control" rows="3" placeholder="زانیارییەکانی یاری وەک: وەشان، قەبارە، پێداویستی..."></textarea>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label>لینکی وێنە</label>
                                <input type="url" id="app-image" class="form-control" placeholder="https://example.com/image.png">
                            </div>
                            <div class="admin-form-group">
                                <label>لینکی داگرتن</label>
                                <input type="url" id="app-download" class="form-control" placeholder="https://example.com/download" required>
                            </div>
                        </div>
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label class="form-checkbox">
                                    <input type="checkbox" id="app-featured">
                                    پاڵێوراو بکە
                                </label>
                            </div>
                        </div>
                        <div class="admin-form-buttons">
                            <button type="submit" class="admin-btn admin-btn-primary"><i class="fas fa-save"></i> زیادکردن</button>
                            <button type="reset" class="admin-btn admin-btn-secondary"><i class="fas fa-redo"></i> پاککردنەوە</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="admin-tab-content" id="manage-apps-tab">
                <div class="admin-form-title"><i class="fas fa-mobile-alt"></i> بەڕێوەبردنی ئەپەکان</div>
                <div class="grid" id="admin-apps-grid">
                    <div class="loading"><i class="fas fa-spinner"></i> بار دەکرێن...</div>
                </div>
            </div>

            <div class="admin-tab-content" id="manage-games-tab">
                <div class="admin-form-title"><i class="fas fa-gamepad"></i> بەڕێوەبردنی یاریەکان</div>
                <div class="grid" id="admin-games-grid">
                    <div class="loading"><i class="fas fa-spinner"></i> بار دەکرێن...</div>
                </div>
            </div>

            <div class="admin-tab-content" id="manage-ios-tab">
                <div class="admin-form-title"><i class="fab fa-apple"></i> بەڕێوەبردنی IOS</div>
                <div class="grid" id="admin-ios-grid">
                    <div class="loading"><i class="fas fa-spinner"></i> بار دەکرێن...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- ===== EDIT MODAL (POPUP) ===== -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <button class="edit-modal-close" id="editModalCloseBtn"><i class="fas fa-times"></i></button>
            <div class="admin-form-title" style="margin-top:8px;"><i class="fas fa-edit"></i> نوێکردنەوەی بەرنامە</div>
            <form id="edit-app-form">
                <input type="hidden" id="edit-app-id">
                <input type="hidden" id="edit-app-type">
                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label>ناو</label>
                        <input type="text" id="edit-app-name" class="form-control" required>
                    </div>
                    <div class="admin-form-group">
                        <label>پاڵێوراو</label>
                        <select id="edit-app-featured" class="form-select">
                            <option value="false">نەخێر</option>
                            <option value="true">بەڵێ</option>
                        </select>
                    </div>
                </div>
                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label>ڤێرژن</label>
                        <input type="text" id="edit-app-version" class="form-control" placeholder="نمونە: 1.0.0">
                    </div>
                    <div class="admin-form-group">
                        <label>پلاتفۆرم</label>
                        <select id="edit-app-platform" class="form-select">
                            <option value="android">Android</option>
                            <option value="ios">iOS</option>
                        </select>
                    </div>
                </div>
                <div class="admin-form-row">
                    <div class="admin-form-group full-width">
                        <label>Description (تەواو)</label>
                        <textarea id="edit-app-description-long" class="form-control" rows="4"></textarea>
                    </div>
                </div>
                <div class="admin-form-row">
                    <div class="admin-form-group full-width">
                        <label>زانیارییەکان (Info)</label>
                        <textarea id="edit-app-info" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="admin-form-row">
                    <div class="admin-form-group">
                        <label>لینکی وێنە</label>
                        <input type="url" id="edit-app-image" class="form-control">
                    </div>
                    <div class="admin-form-group">
                        <label>لینکی داگرتن</label>
                        <input type="url" id="edit-app-download" class="form-control" required>
                    </div>
                </div>
                <div class="admin-form-buttons">
                    <button type="submit" class="admin-btn admin-btn-primary"><i class="fas fa-save"></i> نوێکردنەوە</button>
                    <button type="button" id="cancel-edit" class="admin-btn admin-btn-secondary"><i class="fas fa-times"></i> هەڵوەشاندنەوە</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js">
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf8v2t0GzChcIc1wP6vmNdTZsI5Y-rCfU",
            authDomain: "zhi-zhii.firebaseapp.com",
            projectId: "zhi-zhii",
            storageBucket: "zhi-zhii.firebasestorage.app",
            messagingSenderId: "660343070228",
            appId: "1:660343070228:web:7d360db626016ad4541101",
            measurementId: "G-WLGWYNH6L4"
        };

        let app, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log("✅ Firebase initialized");
            testFirebaseConnection();
        } catch (error) {
            console.error("❌ Firebase error:", error);
        }

        let apps = [], games = [], iosApps = [];
        let isAdminLoggedIn = false;
        let unsubscribeApps = null, unsubscribeGames = null, unsubscribeIos = null;

        const adminAppsGrid = document.getElementById('admin-apps-grid');
        const adminGamesGrid = document.getElementById('admin-games-grid');
        const adminIosGrid = document.getElementById('admin-ios-grid');

        const editModal = document.getElementById('editModal');

        function testFirebaseConnection() {
            if (!db) return;
            db.collection("zhi-zhi").limit(1).get()
                .then(() => { console.log("✅ Firebase connected");
                    loadAllData();
                    setupRealtimeListeners(); })
                .catch(e => { console.error("❌ Firebase connection error:", e); });
        }

        function loadAllData() { if (db) { loadApps(); loadGames(); loadIos(); } }

        function loadApps() {
            if (!db) return;
            db.collection("zhi-zhi").where("type", "==", "app").get()
                .then(snap => {
                    apps = [];
                    snap.forEach(doc => {
                        const d = doc.data();
                        apps.push({ id: doc.id, ...d, name: d.name || "بێ ناو", description: d.description || "",
                            descriptionLong: d.descriptionLong || "", info: d.info || "",
                            imgurl: d.imgurl || "", downloadurl: d.downloadurl || "#", downloads: d.downloads || 0,
                            featured: d.featured || false, version: d.version || "1.0.0",
                            platform: d.platform || "android",
                            createdAt: d.createdAt || new Date().toISOString() });
                    });
                    if (isAdminLoggedIn) renderAdminApps();
                })
                .catch(e => console.error("❌ loadApps error:", e));
        }

        function loadGames() {
            if (!db) return;
            db.collection("zhi-zhi").where("type", "==", "game").get()
                .then(snap => {
                    games = [];
                    snap.forEach(doc => {
                        const d = doc.data();
                        games.push({ id: doc.id, ...d, name: d.name || "بێ ناو", description: d.description || "",
                            descriptionLong: d.descriptionLong || "", info: d.info || "",
                            imgurl: d.imgurl || "", downloadurl: d.downloadurl || "#", downloads: d.downloads || 0,
                            featured: d.featured || false, version: d.version || "1.0.0",
                            platform: d.platform || "android",
                            createdAt: d.createdAt || new Date().toISOString() });
                    });
                    if (isAdminLoggedIn) renderAdminGames();
                })
                .catch(e => console.error("❌ loadGames error:", e));
        }

        function loadIos() {
            if (!db) return;
            db.collection("zhi-zhi").where("type", "==", "ios").get()
                .then(snap => {
                    iosApps = [];
                    snap.forEach(doc => {
                        const d = doc.data();
                        iosApps.push({ id: doc.id, ...d, name: d.name || "بێ ناو", description: d.description || "",
                            descriptionLong: d.descriptionLong || "", info: d.info || "",
                            imgurl: d.imgurl || "", downloadurl: d.downloadurl || "#", downloads: d.downloads || 0,
                            featured: d.featured || false, version: d.version || "1.0.0",
                            platform: d.platform || "ios",
                            createdAt: d.createdAt || new Date().toISOString() });
                    });
                    if (isAdminLoggedIn) renderAdminIos();
                })
                .catch(e => console.error("❌ loadIos error:", e));
        }

        function setupRealtimeListeners() {
            if (!db) return;
            if (unsubscribeApps) unsubscribeApps();
            if (unsubscribeGames) unsubscribeGames();
            if (unsubscribeIos) unsubscribeIos();
            unsubscribeApps = db.collection("zhi-zhi").where("type", "==", "app").onSnapshot(() => loadApps());
            unsubscribeGames = db.collection("zhi-zhi").where("type", "==", "game").onSnapshot(() => loadGames());
            unsubscribeIos = db.collection("zhi-zhi").where("type", "==", "ios").onSnapshot(() => loadIos());
        }

        function sortFeaturedFirst(arr) {
            return arr.sort((a, b) => {
                if (a.featured && !b.featured) return -1;
                if (!a.featured && b.featured) return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });
        }

        function adminLogin(username, password) {
            if (username === "zhs12" && password === "zhizhisun") {
                isAdminLoggedIn = true;
                showPage('admin-panel');
                renderAdminApps(); renderAdminGames(); renderAdminIos(); setupAdminTabs();
                return true;
            } else {
                document.getElementById('login-error').classList.add('show');
                setTimeout(() => document.getElementById('login-error').classList.remove('show'), 3000);
                return false;
            }
        }

        function renderAdminApps() {
            adminAppsGrid.innerHTML = '';
            if (apps.length === 0) { adminAppsGrid.innerHTML = '<div class="no-items"><i class="fas fa-mobile-alt"></i> هیچ ئەپێک بوونی نیە</div>'; return; }
            sortFeaturedFirst(apps).forEach(app => renderAdminCard(adminAppsGrid, app, 'app'));
        }

        function renderAdminGames() {
            adminGamesGrid.innerHTML = '';
            if (games.length === 0) { adminGamesGrid.innerHTML = '<div class="no-items"><i class="fas fa-gamepad"></i> هیچ یارییەک بوونی نیە</div>'; return; }
            sortFeaturedFirst(games).forEach(game => renderAdminCard(adminGamesGrid, game, 'game'));
        }

        function renderAdminIos() {
            adminIosGrid.innerHTML = '';
            if (iosApps.length === 0) { adminIosGrid.innerHTML = '<div class="no-items"><i class="fab fa-apple"></i> هیچ بەرنامەیەکی IOS بوونی نیە</div>'; return; }
            sortFeaturedFirst(iosApps).forEach(ios => renderAdminCard(adminIosGrid, ios, 'ios'));
        }

        function renderAdminCard(container, item, type) {
            const card = document.createElement('div');
            card.className = 'card';
            const icon = type === 'app' ? 'fa-mobile-alt' : type === 'game' ? 'fa-gamepad' : 'fa-apple';
            const version = item.version || '1.0.0';
            const platform = item.platform || (type === 'ios' ? 'ios' : 'android');
            const platformLabel = platform === 'ios' ? 'iOS' : 'Android';

            let pinHTML = '';
            if (item.featured) {
                pinHTML = `<div class="pin-badge"><i class="fas fa-thumbtack"></i></div>`;
            }

            card.innerHTML = `
                <div class="card-img">
                    <div class="image-wrapper">
                        <div class="image-inner">
                            ${item.imgurl ? `<img src="${item.imgurl}" alt="${item.name}" loading="lazy">` : `<i class="fas ${icon} placeholder-icon"></i>`}
                        </div>
                    </div>
                    ${pinHTML}
                    <div class="admin-app-actions">
                        <button class="admin-action-btn edit" data-id="${item.id}" data-type="${type}"><i class="fas fa-edit"></i> دەستکاری</button>
                        <button class="admin-action-btn delete" data-id="${item.id}" data-type="${type}"><i class="fas fa-trash"></i> سڕینەوە</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="card-title">${item.name}</div>
                    <div class="card-meta">
                        <span class="card-category">${type === 'app' ? 'ئەپ' : type === 'game' ? 'یاری' : 'IOS'}</span>
                        <span class="card-version">V${version} ${platformLabel}</span>
                        <span class="card-downloads"><i class="fas fa-download"></i> ${item.downloads || 0}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);

            card.querySelector('.edit').addEventListener('click', (e) => { e.stopPropagation(); editItem(item.id, type); });
            card.querySelector('.delete').addEventListener('click', (e) => { e.stopPropagation(); deleteItem(item.id, type); });
        }

        function editItem(id, type) {
            let item;
            if (type === 'app') item = apps.find(a => a.id === id);
            else if (type === 'game') item = games.find(a => a.id === id);
            else if (type === 'ios') item = iosApps.find(a => a.id === id);
            if (!item) return;

            document.getElementById('edit-app-id').value = id;
            document.getElementById('edit-app-type').value = type;
            document.getElementById('edit-app-name').value = item.name || '';
            document.getElementById('edit-app-description-long').value = item.descriptionLong || '';
            document.getElementById('edit-app-info').value = item.info || '';
            document.getElementById('edit-app-image').value = item.imgurl || '';
            document.getElementById('edit-app-download').value = item.downloadurl || '';
            document.getElementById('edit-app-featured').value = item.featured ? 'true' : 'false';
            document.getElementById('edit-app-version').value = item.version || '1.0.0';
            document.getElementById('edit-app-platform').value = item.platform || (type === 'ios' ? 'ios' : 'android');

            editModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            editModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('editModalCloseBtn').addEventListener('click', closeEditModal);
        editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editModal.classList.contains('active')) closeEditModal(); });

        function deleteItem(id, type) {
            if (!confirm('دڵنیایت دەتەوێت ئەم بەرنامەەی بسڕیتەوە؟')) return;
            if (!db) return;
            db.collection("zhi-zhi").doc(id).delete()
                .then(() => { loadAllData(); })
                .catch(e => console.error("❌ delete error:", e));
        }

        function showPage(pageId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            const el = document.getElementById(`${pageId}-page`);
            if (el) el.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            adminLogin(u, p);
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (!confirm('دڵنیایت دەتەوێت بچیتە دەرەوە؟')) return;
            isAdminLoggedIn = false;
            document.getElementById('admin-login-form').reset();
            showPage('admin-login');
        });

        function setupAdminTabs() {
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                    if (tab.dataset.tab === 'manage-apps') renderAdminApps();
                    if (tab.dataset.tab === 'manage-games') renderAdminGames();
                    if (tab.dataset.tab === 'manage-ios') renderAdminIos();
                });
            });
        }

        document.getElementById('add-app-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('app-type').value;
            const name = document.getElementById('app-name').value;
            const version = document.getElementById('app-version').value || '1.0.0';
            const platform = document.getElementById('app-platform').value || 'android';
            const descriptionLong = document.getElementById('app-description-long').value;
            const info = document.getElementById('app-info').value;
            const imgurl = document.getElementById('app-image').value;
            const downloadurl = document.getElementById('app-download').value;
            const featured = document.getElementById('app-featured').checked;
            if (!type || !name || !downloadurl) { alert('تکایە هەموو خانە پێویستەکان پڕ بکەرەوە'); return; }
            if (!db) return;
            db.collection("zhi-zhi").add({
                type, name,
                description: descriptionLong || '',
                descriptionLong: descriptionLong || '',
                info: info || '',
                imgurl: imgurl || '', downloadurl, downloads: 0, featured,
                version, platform,
                createdAt: new Date().toISOString()
            }).then(() => {
                document.getElementById('add-app-form').reset();
                document.getElementById('app-version').value = '1.0.0';
                document.getElementById('app-platform').value = 'android';
                loadAllData();
            }).catch(e => console.error("❌ add error:", e));
        });

        document.getElementById('edit-app-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-app-id').value;
            const name = document.getElementById('edit-app-name').value;
            const version = document.getElementById('edit-app-version').value || '1.0.0';
            const platform = document.getElementById('edit-app-platform').value || 'android';
            const descriptionLong = document.getElementById('edit-app-description-long').value;
            const info = document.getElementById('edit-app-info').value;
            const imgurl = document.getElementById('edit-app-image').value;
            const downloadurl = document.getElementById('edit-app-download').value;
            const featured = document.getElementById('edit-app-featured').value === 'true';
            if (!db) return;
            db.collection("zhi-zhi").doc(id).update({
                name,
                description: descriptionLong || '',
                descriptionLong: descriptionLong || '',
                info: info || '',
                imgurl: imgurl || '',
                downloadurl, featured,
                version, platform
            }).then(() => {
                closeEditModal();
                document.getElementById('edit-app-form').reset();
                loadAllData();
            }).catch(e => console.error("❌ update error:", e));
        });

        document.getElementById('cancel-edit').addEventListener('click', () => {
            closeEditModal();
            document.getElementById('edit-app-form').reset();
        });

        showPage('admin-login');
    </script>
</body>
</html>
